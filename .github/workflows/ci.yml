name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: la pipeline ha solo bisogno di leggere il codice
permissions:
  contents: read

jobs:
  build:
    name: Build Arduino UNO sketch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino CLI data
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: ${{ runner.os }}-arduino-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Update core index
        run: arduino-cli core update-index

      - name: Update library index
        run: arduino-cli lib update-index

      - name: Install Arduino AVR core
        run: arduino-cli core install arduino:avr

      - name: Install libraries
        shell: bash
        run: |
          # Versioni verificate; aggiornare i pin quando si validano nuove release.
          # Se un pin non è disponibile nell'indice, il fallback unpinned mantiene il CI operativo.
          if ! arduino-cli lib install "LiquidCrystal I2C@1.1.4" "TimerOne@1.2" "Bounce2@2.72" "r89m Buttons@2.0.1" "r89m PushButton@1.0.1"; then
            echo "::warning::Installazione pinned non disponibile; installazione unpinned"
            arduino-cli lib install "LiquidCrystal I2C" "TimerOne" "Bounce2" "r89m Buttons" "r89m PushButton"
          fi

      - name: Compile sketch
        run: >-
          arduino-cli compile
          --fqbn arduino:avr:uno
          --warnings all
          --build-path build
          relay-timer

      - name: Upload HEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrobox-timer-hex
          path: build/*.hex
          if-no-files-found: warn

  test:
    name: Compile-only test gate
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Report current test suite
        run: |
          echo "Compile pulita con --warnings all = gate di test attuale. Test su simulatore (simavr) pianificati — vedi placeholder sotto."

